# Canary: does the LATEST inspect_ai release still work with our adapter?
# Weekly + manual. Failure = the host SDK moved under us (the verify_eval_log
# class of breakage) — fix before a user or host hits it.
name: canary (latest inspect_ai)

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installs what a user gets from `pip install "falsify-inspect[inspect]"`
      # with the newest inspect_ai: the extra keeps agent-client-protocol<1.0
      # (UKGovernmentBEIS/inspect_ai#6417). A red run here means our adapter
      # broke against the latest host SDK.
      - name: Install adapter + LATEST host SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[inspect]" pytest
          python -m pip install --upgrade inspect_ai "agent-client-protocol<1.0"
          python -c "import inspect_ai, importlib.metadata as m; print('inspect_ai', inspect_ai.__version__, 'acp', m.version('agent-client-protocol'))"
      - name: Test suite against latest inspect_ai
        run: python -m pytest tests/ -q
      - name: Offline showcase end-to-end (real eval, mockllm)
        run: |
          cd examples/offline-mockllm
          python run_showcase.py
      # Watch step, never fails the job: does the latest inspect_ai work with
      # agent-client-protocol 1.x yet? When this step turns green, drop the
      # pin from the `inspect` extra in pyproject.toml.
      - name: "Upstream watch: latest agent-client-protocol (informational)"
        continue-on-error: true
        run: |
          python -m pip install --upgrade agent-client-protocol
          python -c "import importlib.metadata as m; print('acp', m.version('agent-client-protocol'))"
          python -m pytest tests/ -q
